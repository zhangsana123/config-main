# ========================================
# ZMK firmware build matrix
# 只编译 allium46（46键）OLED 固件 + settings_reset（清配对用）
# =========================================
---
include:
  ### ALLIUM46 START ###
  # nice!oled
  - board: nice_nano_v2
    shield: allium46_left nice_oled
    cmake-args: -DCONFIG_ZMK_KEYBOARD_NAME=\"Allium46\"
    artifact-name: nice_allium46_left_oled
    snippet: studio-rpc-usb-uart
  - board: nice_nano_v2
    shield: allium46_right nice_oled
    artifact-name: nice_allium46_right_oled

  # peripheral_left
  - board: nice_nano_v2
    shield: allium46_left_peripheral nice_oled
    artifact-name: nice_allium46_left_peripheral_oled

  # nice_nano_v2 dongle (Pro Micro)
  - board: nice_nano_v2
    shield: allium46_dongle_pro_micro nice_oled
    cmake-args: -DCONFIG_ZMK_KEYBOARD_NAME=\"Allium46_Dongle\" -DCONFIG_ZMK_SLEEP=n
    artifact-name: nice_allium46_dongle
    snippet: studio-rpc-usb-uart
  ### ALLIUM46 END ###

  ### SETTINGS_RESET START ###
  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: nice_settings_reset
  ### SETTINGS_RESET END ###